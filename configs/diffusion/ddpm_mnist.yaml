# Class-conditional DDPM on MNIST with classifier-free guidance. ~20 min on one GPU.
family: diffusion
name: diffusion-ddpm-mnist
seed: 0
data:
  dataset: mnist
  image_size: 32
  batch_size: 128
  num_workers: 4
model:
  base_channels: 32
  channel_mults: [1, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [8]
  dropout: 0.1
method:
  timesteps: 1000
  schedule: linear        # linear | cosine
  conditional: true
  p_uncond: 0.1           # label dropout for classifier-free guidance
  guidance_scale: 2.0     # used for the sample grids
  sample_steps: 50        # DDIM steps for the sample grids
train:
  steps: 20000
  lr: 2.0e-4
  warmup_steps: 500
  ema_decay: 0.999
  log_every: 100
  sample_every: 2000
  ckpt_every: 5000
hub:
  repo_id: null
  private: true
