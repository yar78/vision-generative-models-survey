# Unconditional DDPM on Ray_dog at 64x64. With 258 images, watch for memorisation:
# compare samples with their nearest training images (see the notebook).
family: diffusion
name: diffusion-ddpm-ray-dog-64
seed: 0
data:
  dataset: hf
  hf_repo: yaryar78/Ray_dog   # 258 photos of one dog, mixed sizes; decoded and cached in memory once
  image_size: 64
  cache_size: 96             # short side after the one-off downscale; random 64px crops come from this
  random_crop: true
  crop_scale: [0.5, 1.0]
  hflip: true
  batch_size: 32
  num_workers: 4
model:
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.2              # higher than usual: small dataset
method:
  timesteps: 1000
  schedule: cosine
  conditional: false
  sample_steps: 50
train:
  steps: 40000
  lr: 1.0e-4
  warmup_steps: 1000
  ema_decay: 0.999
  log_every: 50
  sample_every: 2000
  ckpt_every: 2000
hub:
  repo_id: null
  private: true
