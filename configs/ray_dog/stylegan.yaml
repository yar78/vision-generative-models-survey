# Compact StyleGAN2 + DiffAugment on Ray_dog at 64x64. The most interesting GAN
# experiment here: style mixing and truncation on a single subject.
family: stylegan
name: stylegan2-ray-dog-64
seed: 0
data:
  dataset: hf
  hf_repo: yaryar78/Ray_dog   # 258 photos of one dog, mixed sizes; decoded and cached in memory once
  image_size: 64
  cache_size: 96             # short side after the one-off downscale; random 64px crops come from this
  random_crop: true
  crop_scale: [0.5, 1.0]
  hflip: true
  batch_size: 32
  num_workers: 4
model:
  z_dim: 256
  w_dim: 256
  mapping_layers: 8
  channels: 256
  max_channels: 256
  d_channels: 256
method:
  r1_gamma: 0.1
  r1_every: 16
  style_mixing_prob: 0.9
  diffaugment: color,translation,cutout
train:
  steps: 50000
  lr: 2.0e-3
  ema_decay: 0.999
  log_every: 50
  sample_every: 1000
  ckpt_every: 2000
hub:
  repo_id: null
  private: true
