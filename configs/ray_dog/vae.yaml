# VAE on Ray_dog at 64x64. Expect blurry but recognisable dogs: the VAE's
# Gaussian likelihood averages over details it cannot model.
family: vae
name: vae-ray-dog-64
seed: 0
data:
  dataset: hf
  hf_repo: yaryar78/Ray_dog   # 258 photos of one dog, mixed sizes; decoded and cached in memory once
  image_size: 64
  cache_size: 96             # short side after the one-off downscale; random 64px crops come from this
  random_crop: true
  crop_scale: [0.5, 1.0]
  hflip: true
  batch_size: 32
  num_workers: 4
model:
  latent_dim: 128
  base_channels: 32
  channel_mults: [1, 2, 4, 8]
method:
  beta: 1.0
  kl_warmup_steps: 2000
train:
  steps: 20000
  lr: 5.0e-4
  log_every: 50
  sample_every: 1000
  ckpt_every: 2000
hub:
  repo_id: null
  private: true
