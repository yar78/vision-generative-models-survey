# Rectified flow on Ray's aligned face crops at 64x64. Same U-Net, data and budget as
# configs/ray_dog_faces/ddpm.yaml, so the two are directly comparable.
family: flow_matching
name: flowmatching-rf-ray-dog-faces-64
seed: 0
data:
  dataset: hf
  hf_repo: yaryar78/Ray_dog_faces   # private: log in to Hugging Face first
  image_size: 64
  cache_size: 64
  random_crop: false        # cropping would undo the alignment
  hflip: true
  batch_size: 32
  num_workers: 4
model:
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.2
method:
  sigma_min: 0.0
  time_sampling: logit_normal
  conditional: false
  sample_steps: 50
  solver: heun
train:
  steps: 40000
  lr: 1.0e-4
  warmup_steps: 1000
  ema_decay: 0.999
  log_every: 50
  sample_every: 2000
  ckpt_every: 2000
hub:
  repo_id: null
  private: true
