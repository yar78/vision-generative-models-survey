# Small StyleGAN2 on MNIST: a quick run (~20-30 min) to see the mechanics work.
family: stylegan
name: stylegan2-mnist
seed: 0
data:
  dataset: mnist
  image_size: 32
  batch_size: 64
  num_workers: 4
model:
  z_dim: 128
  w_dim: 128
  mapping_layers: 4
  channels: 128
  max_channels: 128
  d_channels: 128
method:
  r1_gamma: 0.01
  r1_every: 16
  style_mixing_prob: 0.9
train:
  steps: 20000
  lr: 2.5e-3
  ema_decay: 0.999
  log_every: 100
  sample_every: 1000
  ckpt_every: 5000
hub:
  repo_id: null
  private: true
