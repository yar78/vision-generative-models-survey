[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genmodels"
version = "0.1.0"
description = "From-scratch GAN, StyleGAN, VAE, diffusion and flow-matching image models, with Hugging Face Hub upload."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "torchvision>=0.16",
    "huggingface_hub>=0.23",
    "datasets>=2.18",
    "safetensors",
    "tensorboard",
    "pyyaml",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipywidgets"]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
include = ["genmodels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
